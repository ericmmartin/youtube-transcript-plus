name: Bug report
description: Something is not working as documented
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. This library uses YouTube's unofficial Innertube
        API, so behavior often varies by video, language, and region — the more
        specific you can be, the faster this gets fixed.

        If this is a security vulnerability, please **do not** file it here. See
        [SECURITY.md](https://github.com/ericmmartin/youtube-transcript-plus/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: input
    id: video-id
    attributes:
      label: Video ID or URL
      description: >-
        If the video is public, this is the single most useful thing you can
        provide. Leave blank if the video is private or unlisted.
      placeholder: dQw4w9WgXcQ
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal code sample, including the config you passed.
      render: javascript
      placeholder: |
        import { fetchTranscript } from 'youtube-transcript-plus';

        await fetchTranscript('dQw4w9WgXcQ', { lang: 'en' });
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: The full error, including the error class name and stack trace.
      render: shell
    validations:
      required: false

  - type: input
    id: package-version
    attributes:
      label: youtube-transcript-plus version
      placeholder: 2.0.1
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v22.11.0
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Server / container
        - Serverless (Lambda, Vercel, Cloudflare, etc.)
        - CI
        - Other
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using a supported Node.js version (>= 20)
          required: true
        - label: I searched existing issues for a duplicate
          required: true
        - label: >-
            I confirmed the transcript is actually available for this video on
            youtube.com (transcripts can be disabled by the uploader)
          required: false
